name: Build iOS IPA (unsigned)

# Genera un .ipa NON firmato (da firmare in locale con AltStore/Sideloadly + Apple ID gratuito).
# mode=dev-client -> configurazione Debug, JS da Metro (Fast Refresh da Windows).
# mode=release    -> configurazione Release, JS incluso (standalone).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo di build"
        type: choice
        options: [dev-client, release]
        default: dev-client
      runner:
        description: "Computer macOS (solo arm64: le immagini Intel hanno Xcode 26.3, troppo vecchio per Expo SDK 58)"
        type: choice
        options: [macos-26, macos-15]
        default: macos-26

concurrency:
  group: build-ios-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.runner }}
  cancel-in-progress: true

env:
  APP_NAME: Fragolina
  WIDGET_NAME: FragolinaWidget
  XCODE_APP: /Applications/Xcode_26.6.app
  BUILD_NUMBER: ${{ github.run_number }}
  # Mostrati in Noi ("Versione 1.0.0 (build N, abc1234)"): servono a capire quale IPA è installata.
  GIT_SHA: ${{ github.sha }}
  # Chiavi PUBBLICHE di Supabase (secrets del repository, messi da `npm run ship`). Se mancano, l'app parte in modalità prova.
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  build:
    permissions:
      contents: write # serve alla release `latest-build` (canale aggiornamenti)
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app | grep -v beta | sort -V | tail -1)"
          fi
          echo "Uso $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          node -v

      - name: Install JS dependencies
        run: |
          npm install -g npm@12
          npm -v
          npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Unit tests
        run: npx --no-install vitest run

      - name: Backend mode
        run: |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] && [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then echo "Backend: Supabase (chiavi presenti)"; else echo "Backend: prova locale (nessuna chiave)"; fi

      - name: Generate user-art manifest and icons
        run: |
          node scripts/sync-user-art.mjs
          test -f assets/icon.png || node scripts/make-icon.mjs

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Prebuild iOS project (CNG + widget target)
        run: |
          set -euo pipefail
          CI=1 npx expo prebuild --platform ios --clean
          test -d "ios/$APP_NAME.xcworkspace" || { echo "::error::workspace mancante dopo prebuild"; ls ios; exit 1; }
          echo "--- target generati"; ls ios ios/.targets 2>/dev/null || true

      - name: Archive (code signing disabled)
        run: |
          set -euo pipefail
          CONFIG=$([ "${{ inputs.mode }}" = "release" ] && echo Release || echo Debug)
          echo "Configuration: $CONFIG"
          xcodebuild archive \
            -workspace "ios/$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | (command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat) \
            || { echo "::error::xcodebuild archive fallito"; tail -80 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Fake-sign with entitlements (ldid) so the sideloader sees the App Group
        run: |
          set -euo pipefail
          brew install ldid
          APP="$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          APPEX="$APP/PlugIns/$WIDGET_NAME.appex"
          test -d "$APPEX" || { echo "::error::widget extension mancante nell'archivio"; ls -R "$APP" | head -50; exit 1; }
          APP_ENT=$(find ios -maxdepth 3 -name "$APP_NAME.entitlements" | head -1)
          WID_ENT=$(find ios -maxdepth 4 -path "*$WIDGET_NAME*" -name "*.entitlements" | head -1)
          echo "entitlements app: $APP_ENT | widget: $WID_ENT"
          test -n "$APP_ENT" && test -n "$WID_ENT" || { echo "::error::file entitlements non trovati"; find ios -name "*.entitlements"; exit 1; }
          ldid -S"$APP_ENT" "$APP/$APP_NAME"
          ldid -S"$WID_ENT" "$APPEX/$WIDGET_NAME"
          echo "--- entitlements app";    ldid -e "$APP/$APP_NAME"
          echo "--- entitlements widget"; ldid -e "$APPEX/$WIDGET_NAME"
          ldid -e "$APP/$APP_NAME"        | grep -q "com.apple.security.application-groups" || { echo "::error::app senza App Group"; exit 1; }
          ldid -e "$APPEX/$WIDGET_NAME"   | grep -q "com.apple.security.application-groups" || { echo "::error::widget senza App Group"; exit 1; }

      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload" out
          cp -R "$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/$APP_NAME-${{ inputs.mode }}.ipa" Payload)
          ls -lh out
          unzip -l "out/$APP_NAME-${{ inputs.mode }}.ipa" | grep -E "\.appex/Info.plist" || { echo "::error::appex assente nell'ipa"; exit 1; }

      - name: Upload IPA
        id: up1
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ inputs.mode }}-ipa
          path: out/*.ipa
          retention-days: 7
          if-no-files-found: error

      # Il servizio artifact di GitHub a volte risponde con errori temporanei: un secondo tentativo dopo una pausa.
      - name: Upload IPA (secondo tentativo)
        if: steps.up1.outcome == 'failure'
        run: sleep 45
      - name: Upload IPA (secondo tentativo, upload)
        if: steps.up1.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ inputs.mode }}-ipa
          path: out/*.ipa
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      # Canale aggiornamenti (solo release): l'IPA più recente e una "sorgente" SideStore su una release fissa `latest-build`.
      # L'IPA contiene solo la chiave PUBBLICA di Supabase (vedi DECISIONS, sessione 11).
      - name: Publish update channel (release only)
        if: inputs.mode == 'release'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "out/$APP_NAME-release.ipa" out/Fragolina.ipa
          SIZE=$(stat -f%z out/Fragolina.ipa 2>/dev/null || stat -c%s out/Fragolina.ipa)
          VERSION=$(node -p "require('./app.config.js').expo.version")
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-build/Fragolina.ipa"
          node -e '
            const [url,size,version,date,build,sha]=process.argv.slice(1);
            const app={name:"Fragolina",bundleIdentifier:"app.fragolina.couple",developerName:"Fragolina",subtitle:"Solo per noi due",localizedDescription:"L'app privata di coppia.",version,versionDate:date,downloadURL:url,size:Number(size),
              versions:[{version,buildVersion:build,date,downloadURL:url,size:Number(size),localizedDescription:"build "+build+" ("+sha+")"}]};
            require("fs").writeFileSync("out/source.json",JSON.stringify({name:"Fragolina",identifier:"app.fragolina.source",apps:[app],news:[]},null,2));
          ' "$URL" "$SIZE" "$VERSION" "$DATE" "$BUILD_NUMBER" "${GITHUB_SHA::7}"
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build out/Fragolina.ipa out/source.json --prerelease --title "build ${BUILD_NUMBER}" --notes "build=${BUILD_NUMBER} sha=${GITHUB_SHA::7}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 3
